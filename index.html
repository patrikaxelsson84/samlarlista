<title>Pokémon Samlarlista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a printed set checklist brought to life. Grey banded rows, condensed type, boxes that fill green. */
:root{
  --paper:#f3f4f2; --sheet:#ffffff; --band:#e6e8e5; --ink:#1c1f22; --muted:#666c70; --line:#c9cdc9;
  --own:#2f9e4f; --own-ink:#ffffff; --box:#ffffff; --box-line:#3a3f43; --accent:#c8312b; --chip:#eceeeb;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16181a; --sheet:#1d2022; --band:#262a2c; --ink:#e9ebe8; --muted:#9aa09f; --line:#353a3c;
  --own:#3fb562; --own-ink:#0b1a10; --box:#2b2f31; --box-line:#9aa09f; --accent:#ef6a5f; --chip:#2a2e30; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16181a; --sheet:#1d2022; --band:#262a2c; --ink:#e9ebe8; --muted:#9aa09f; --line:#353a3c;
  --own:#3fb562; --own-ink:#0b1a10; --box:#2b2f31; --box-line:#9aa09f; --accent:#ef6a5f; --chip:#2a2e30; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:8px 14px;border-bottom:3px solid var(--ink)}
.top h1{font-size:2.1rem;font-weight:800;letter-spacing:.01em;line-height:1}
.top h1 small{display:block;font-size:.8rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.save{font-size:.8rem;color:var(--muted)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:56px;height:56px;border-radius:12px;object-fit:cover;border:2px solid var(--ink);background:var(--sheet);flex:none}
.imgprev{width:72px;height:72px;border-radius:14px;object-fit:cover;border:2px solid var(--line)}
.custom{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px}
.search{width:100%;max-width:340px;padding:9px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);font:inherit}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-block:14px}

/* menu */
.series{margin-top:22px}
.series h2{font-size:1.25rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;gap:10px;align-items:baseline;padding-bottom:6px;border-bottom:1px solid var(--line)}
.series h2 span{font-family:var(--body);font-size:.8rem;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:10px}
.set{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;text-align:left;padding:10px 12px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;cursor:pointer;text-decoration:none;color:var(--ink)}
.set:hover{border-color:var(--box-line)}
.code{grid-row:span 2;font-family:var(--display);font-weight:700;font-size:.95rem;min-width:46px;text-align:center;padding:5px 4px;border-radius:4px;background:var(--chip);letter-spacing:.04em}
.set b{font-family:var(--display);font-weight:600;font-size:1.12rem;line-height:1.15;min-width:0}
.meta{font-size:.78rem;color:var(--muted);display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.prog{flex:1;height:5px;background:var(--band);border-radius:3px;overflow:hidden;min-width:40px}
.prog i{display:block;height:100%;background:var(--own)}

/* set view */
.back{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--sheet);cursor:pointer;font-weight:600}
.head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-end;justify-content:space-between;padding-block:14px 10px;border-bottom:3px solid var(--ink)}
.head h1{font-size:clamp(1.8rem,6vw,3rem);font-weight:800;font-style:italic;text-transform:uppercase;line-height:.95;letter-spacing:.01em}
.head h1 small{display:block;font-size:.85rem;font-style:normal;font-weight:600;letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
.stats{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1}
.stat span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:7px 12px;cursor:pointer;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:0 18px}
.row{display:grid;grid-template-columns:2.6rem auto auto minmax(0,1fr) 2.4rem;align-items:center;gap:8px;min-height:40px;padding:3px 8px;font-variant-numeric:tabular-nums}
.row:nth-child(odd){background:var(--band)}
.num{font-family:var(--display);font-weight:600;color:var(--muted);font-size:.95rem}
.nm{font-family:var(--display);font-weight:600;font-size:1.06rem;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.sym{text-align:right;font-weight:700;font-size:.95rem;white-space:nowrap}
.v{display:flex;align-items:center;gap:2px}
.v.empty{visibility:hidden}
.bx{width:28px;height:28px;border:2px solid var(--box-line);background:var(--box);border-radius:3px;font-family:var(--display);font-weight:800;font-size:.95rem;display:grid;place-items:center;cursor:pointer;padding:0;transition:background .12s}
.bx.on{background:var(--own);border-color:var(--own);color:var(--own-ink)}
.pm{width:26px;height:28px;border:0;background:transparent;cursor:pointer;font-size:1.15rem;font-weight:600;padding:0;border-radius:4px;color:var(--ink)}
.pm:hover{background:var(--chip)}
.pm:disabled{opacity:.25;cursor:default;background:transparent}
.ct{min-width:1.3em;text-align:center;font-weight:600;font-size:.92rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:20px;padding-top:12px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.legend b{color:var(--ink)}
.note{font-size:.8rem;color:var(--muted);margin-top:10px;max-width:65ch}
.emptymsg{padding:24px 0;color:var(--muted)}
@media (max-width:560px){
  .row{grid-template-columns:2.3rem auto minmax(0,1fr) auto;grid-template-areas:"n m m s" ". a b b";row-gap:4px;padding-block:6px}
  .num{grid-area:n}.nm{grid-area:m}.sym{grid-area:s}.vn{grid-area:a}.vr{grid-area:b;margin-left:14px}
}
@media (prefers-reduced-motion:reduce){.bx{transition:none}}
</style>

</head><body><div class="wrap" id="app"></div>

function lsGet(id){ try{ return JSON.parse(localStorage.getItem('ptcg:'+id)||'null'); }catch(e){ return null; } }
function lsSet(id,o){ try{ localStorage.setItem('ptcg:'+id, JSON.stringify(o)); }catch(e){} }

/* backup: export / import a JSON file */
function exportBackup(){
  const all={}; try{ for(let i=0;i<localStorage.length;i++){ const key=localStorage.key(i); if(key.startsWith('ptcg:')) all[key.slice(5)]=JSON.parse(localStorage.getItem(key)); } }catch(e){}
  const blob=new Blob([JSON.stringify({app:'pokemon-samlarlista',v:1,date:new Date().toISOString(),sets:all})],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pokemon-samling-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); const sets=d.sets||{}; let n=0;
      for(const id in sets){ if(BYID[id]){ counts[id]=sets[id]; lsSet(id,sets[id]); n++; } }
      backupMsg='Återställde '+n+' serier från säkerhetskopian.'; render();
    }catch(e){ backupMsg='Filen kunde inte läsas. Välj en säkerhetskopia som appen har sparat.'; render(); } };
  r.readAsText(file);
}

const DEFAULT_IMG = null;

let appImg = (()=>{ try{ const v=localStorage.getItem('ptcg-img'); if(v==='none') return null; if(v) return v; }catch(e){} return DEFAULT_IMG; })();
function square(img, size){
  const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
  x.fillStyle='#ffffff'; x.fillRect(0,0,size,size);
  const m=Math.min(img.naturalWidth,img.naturalHeight);
  x.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,size,size);
  return c;
}
function loadImg(src){ return new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=src; }); }
async function pickImage(file){
  try{
    const url=URL.createObjectURL(file); const img=await loadImg(url); URL.revokeObjectURL(url);
    appImg=square(img,512).toDataURL('image/png');
    try{ localStorage.setItem('ptcg-img',appImg); }catch(e){}
    imgMsg='';
  }catch(e){ imgMsg='Bilden kunde inte öppnas. Prova en JPG- eller PNG-bild.'; }
  applyIcon(); render();
}
function applyIcon(){

function saveFile(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);

async function downloadPart(which){
  try{
    if(which==='index'){
      let src;
      try{ const r=await fetch('index.html',{cache:'no-store'}); if(!r.ok) throw 0; src=await r.text(); }catch(e){ src='<!doctype html>'+document.documentElement.outerHTML; }
      src = src.replace(/const DEFAULT_IMG = (null|"[^"]*");/, ()=>'const DEFAULT_IMG = '+JSON.stringify(appImg)+';');
      saveFile(new Blob([src],{type:'text/html'}),'index.html');
    } else {
      const size = which==='i192'?192:512, img=await loadImg(appImg);
      const blob = await new Promise(ok=>square(img,size).toBlob(ok,'image/png'));

}

/* ---------- helpers ---------- */
function progress(id){
  const c = get(id), cards = DATA.cards[id]||[];
  let have=0, vHave=0, vTot=0;
  for(const [num,,,t] of cards){
    const n = c[k('n',num)]||0, r = (t&1) ? (c[k('r',num)]||0) : 0;
    vTot += (t&1)?2:1; vHave += (n>0)+(r>0);
    if(n||r) have++;
  }
  return {have, total:cards.length, vHave, vTot};
}

    <div class="bar"><input id="msearch" class="search" type="search" placeholder="Sök serie, t.ex. Brilliant Stars eller BRS" value="${esc(menuQuery)}" aria-label="Sök serie"></div>
    ${order.length? order.map(sr=>`
      <section class="series"><h2>${esc(SERIES_SV[sr]||sr)} <span>${groups[sr].length} serier</span></h2>
      <div class="sets">${groups[sr].map(s=>{const p=progress(s.id);return `
        <a class="set" href="#set-${s.id}"><span class="code">${esc(s.code||s.id.toUpperCase())}</span><b>${esc(s.name)}</b>
        <span class="meta">${fmtDate(s.date)} · ${p.have}/${p.total}<span class="prog"><i style="width:${p.total?p.have/p.total*100:0}%"></i></span></span></a>`}).join('')}</div></section>`).join('')
    : '<p class="emptymsg">Ingen serie matchar sökningen.</p>'}
    <section class="series"><h2>Appens bild</h2>
      <p class="note">Välj en bild från telefonen. Den visas här i appen direkt. Vill du att bilden ska följa med till andra, laddar du ner filerna nedan.</p>
      <div class="custom">${appImg?`<img class="imgprev" src="${appImg}" alt="Vald bild">`:""}
        <label class="back" for="pick">${appImg?"Byt bild":"Välj bild"}</label><input id="pick" type="file" accept="image/*" hidden>
        ${appImg?`<button class="back" id="noimg">Ta bort bild</button>`:""}</div>
      ${appImg?`<p class="note">Ladda ner de tre filerna och ladda upp dem till GitHub, så får alla som installerar appen den här bilden.</p>
      <div class="bar"><button class="back" data-dl="index">1. index.html</button><button class="back" data-dl="i192">2. icon-192.png</button><button class="back" data-dl="i512">3. icon-512.png</button></div>`:""}
      ${imgMsg?`<p class="note"><b>${esc(imgMsg)}</b></p>`:""}</section>
    <section class="series"><h2>Säkerhetskopia</h2>
      <p class="note">Samlingen sparas bara i den här telefonen. Spara en kopia ibland, så kan du flytta samlingen till en ny telefon eller få tillbaka den om webbläsarens data rensas.</p>
      <div class="bar"><button class="back" id="exp">Spara säkerhetskopia</button><label class="back" for="imp">Återställ från fil</label><input id="imp" type="file" accept=".json,application/json" hidden></div>
      ${backupMsg?`<p class="note"><b>${esc(backupMsg)}</b></p>`:''}</section>
    <p class="note">Kortlistor för ${SETS.length} engelska serier, från Base Set till ${esc([...SETS].sort((a,b)=>b.date.localeCompare(a.date))[0].name)}.</p>`;
  document.getElementById('exp').onclick=exportBackup;
  document.getElementById('pick').onchange=e=>{ if(e.target.files[0]) pickImage(e.target.files[0]); };
  const ni=document.getElementById('noimg'); if(ni) ni.onclick=()=>{ appImg=null; try{localStorage.setItem('ptcg-img','none')}catch(e){} imgMsg=''; applyIcon(); render(); };
  app.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>downloadPart(b.dataset.dl));
  document.getElementById('imp').onchange=e=>{ if(e.target.files[0]) importBackup(e.target.files[0]); };
  const inp = document.getElementById('msearch');
  inp.addEventListener('input', e=>{ menuQuery=e.target.value; const pos=e.target.selectionStart; renderMenu(); const n=document.getElementById('msearch'); n.focus(); n.setSelectionRange(pos,pos); });
}

/* ---------- set view ---------- */
let filter='all', cardQuery='';
function variantHTML(v, num, t, c){
  const has = v==='r' ? (t&1) : true;
  if(!has) return `<span class="v v${v} empty" aria-hidden="true"><span class="bx"></span><span class="pm"></span><span class="ct"></span><span class="pm"></span></span>`;
  const n = c[k(v,num)]||0;
  const L = v==='r' ? 'R' : ((t&2)?'H':'N');
  const lbl = v==='r' ? 'reverse holo' : ((t&2)?'holo':'normal');
  return `<span class="v v${v}"><button class="bx ${n?'on':''}" data-a="tog" data-v="${v}" data-num="${esc(num)}" aria-pressed="${n>0}" aria-label="${lbl}">${L}</button>`+
    `<button class="pm" data-a="dec" data-v="${v}" data-num="${esc(num)}" aria-label="Ta bort ett ${lbl}" ${n?'':'disabled'}>−</button>`+
    `<span class="ct">${n}</span>`+
    `<button class="pm" data-a="inc" data-v="${v}" data-num="${esc(num)}" aria-label="Lägg till ett ${lbl}">+</button></span>`;
}
function rowsHTML(id){
  const c = get(id), q = cardQuery.trim().toLowerCase();
  const out = [];
  for(const [num,name,ri,t] of DATA.cards[id]){
    const owned = (c[k('n',num)]||0) + ((t&1)?(c[k('r',num)]||0):0);
    const full = (c[k('n',num)]||0)>0 && (!(t&1) || (c[k('r',num)]||0)>0);
    if(filter==='have' && !owned) continue;
    if(filter==='miss' && full) continue;
    if(q && !name.toLowerCase().includes(q) && num!==q.replace(/^0+/,'')) continue;
    const r = DATA.rar[ri];
    out.push(`<div class="row"><span class="num">${/^\d+$/.test(num)?num.padStart(3,'0'):esc(num)}</span>${variantHTML('n',num,t,c)}${variantHTML('r',num,t,c)}<span class="nm">${esc(name)}</span><span class="sym" title="${esc(r)}">${esc(RSYM[r]??r)}</span></div>`);
  }
  return out.length ? out.join('') : '<p class="emptymsg">Inga kort här.</p>';
}
function statsHTML(id){
  const p = progress(id);
  return `<div class="stat"><b>${p.have}/${p.total}</b><span>Kort</span></div><div class="stat"><b>${p.vHave}/${p.vTot}</b><span>Varianter</span></div><div class="stat"><b>${p.total?Math.round(p.have/p.total*100):0}%</b><span>Klart</span></div>`;
}
function renderSet(id){
  const s = BYID[id];
  app.innerHTML = `
    <div class="bar" style="margin-top:4px"><a class="back" href="#">← Alla serier</a></div>
    <div class="head"><h1><small>${esc(s.series)} · ${esc(s.code||'')} · ${s.date.slice(0,4)}</small>${esc(s.name)}</h1><div class="stats" id="stats">${statsHTML(id)}</div></div>
    <div class="bar">
      <div class="seg" role="group" aria-label="Visa">${[['all','Alla'],['miss','Saknas'],['have','Har']].map(([f,l])=>`<button data-f="${f}" aria-pressed="${filter===f}">${l}</button>`).join('')}</div>
      <input id="csearch" class="search" type="search" placeholder="Sök kort eller nummer" value="${esc(cardQuery)}" aria-label="Sök kort">
    </div>
    <div class="list" id="list">${rowsHTML(id)}</div>
    <div class="legend"><span><b>N</b> normal</span><span><b>H</b> holo</span><span><b>R</b> reverse holo</span><span><b>●</b> common</span><span><b>◆</b> uncommon</span><span><b>★</b> rare</span><span><b>★H</b> holo rare</span><span><b>☆</b> holo rare V</span><span><b>☆X</b> VMAX</span><span><b>V☆</b> VSTAR</span><span><b>★U</b> ultra rare</span><span><b>★S</b> secret rare</span></div>`;
  const list = document.getElementById('list');
  list.addEventListener('click', e=>{
    const b = e.target.closest('button[data-a]'); if(!b) return;
    const c = get(id), key = k(b.dataset.v, b.dataset.num);
    let n = c[key]||0;
    if(b.dataset.a==='inc') n++;
    else if(b.dataset.a==='dec') n = Math.max(0,n-1);
    else n = n ? 0 : 1;
    if(b.dataset.a==='tog' && (c[key]||0)>1) n = c[key]; // box only toggles 0↔1
    if(n) c[key]=n; else delete c[key];
    persist(id);
    // update this variant in place so filters don't make rows jump while counting
    const v = b.closest('.v'); const t = DATA.cards[id].find(x=>x[0]===b.dataset.num)[3];
    v.outerHTML = variantHTML(b.dataset.v, b.dataset.num, t, c);
    document.getElementById('stats').innerHTML = statsHTML(id);
  });
  app.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{ filter=b.dataset.f; renderSet(id); }));
  document.getElementById('csearch').addEventListener('input', e=>{ cardQuery=e.target.value; list.innerHTML = rowsHTML(id); });
}

/* ---------- routing ---------- */
function render(){
  const m = location.hash.match(/^#set-([a-z0-9-]+)$/);
  if(m && BYID[m[1]]) renderSet(m[1]); else renderMenu();
}
let lastHash = location.hash;
window.addEventListener('hashchange', ()=>{ if(location.hash.startsWith('#set-')){ cardQuery=''; filter='all'; } render(); window.scrollTo(0,0); });
render();
</script>
